name: tessera

# One service, because that is the whole point — the frontend is embedded in the
# binary. Build it with `pnpm docker:build`, which runs the SPA build first; the
# Dockerfile embeds `apps/web/dist` only when it is present in the context.
services:
  tessera:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        # Without this `/health` reports `unknown` — `.git` is not in the build
        # context, so the commit has to be handed in.
        TESSERA_BUILD_REV: ${TESSERA_BUILD_REV:-unknown}
    init: true
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      # Inside a container the loopback address would only be reachable from
      # inside the container.
      TESSERA_SERVER__HOST: 0.0.0.0
      TESSERA_DATABASE__URL: sqlite:///data/tessera.db?mode=rwc
      TESSERA_STORAGE__URL: /data/blobs
    # No `healthcheck:` here — the image declares its own, which re-executes the
    # binary with `--health-check` so the probe reads the same configuration and
    # therefore always targets the port the server actually listens on.
    restart: unless-stopped
