# Reserved for workspace-wide cargo settings.
#
# `SQLX_OFFLINE` used to live here, back when the data layer used `sqlx::query!`
# and needed committed `.sqlx` metadata to build without a database. SeaORM builds
# its queries at runtime, so that machinery — the environment variable, the
# `.sqlx` directory, and the "did you remember to run `cargo sqlx prepare`" step
# — is gone. Nothing replaces it: `cargo build` needs no database.
