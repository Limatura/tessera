# tessera — 開放給不特定人使用的範例設定
#
# 情境:架在公網上,任何人都能上傳。你不認識使用者,也不會想認識。
# 每一項都比個人用的緊,因為這台的每一個資源都是陌生人在花。
#
# 用法:複製成 tessera.yaml 放在執行檔旁邊,或用 TESSERA_CONFIG_FILE 指過來。
#
# ⚠ 上線前先讀最下面「還沒有的東西」那段。有兩件事現在沒辦法用設定解決,
#    在它們做出來之前,這台需要外部的防護。

server:
  host: 0.0.0.0
  # 25 MiB。陌生人上傳的東西沒有理由給到預設的 100 MiB。
  max_body_bytes: 26214400
  # 前面有 nginx / Caddy / Cloudflare 的話,把它的位址列在這裡,節流才看得到
  # 真實來源 IP。只有從這些位址進來的連線,它送的 X-Forwarded-For 才會被採信。
  # ⚠ 要寫代理自己的位址,不是使用者的。列錯或列太寬(例如 0.0.0.0/0)等於
  #    讓任何人自己宣稱自己的 IP,節流就完全失效。
  #    同一台機器上的代理是 127.0.0.1;docker compose 裡的是那個網段。
  #    用環境變數的話兩種寫法都收:TESSERA_SERVER__TRUSTED_PROXIES='127.0.0.1, ::1'
  trusted_proxies:
    - 127.0.0.1
    - ::1
  # 前端跟後端同源的話留空。分開部署才需要列出來。
  cors_allowed_origins: []

features:
  # 這台存在的意義就是讓人不用註冊就能傳東西。
  anonymous_upload: true
  # 關掉管理端點,除非你真的要從瀏覽器管這台。
  admin: false
  # 對外的機器不需要把 API 參考頁掛出來。openapi.json 照樣提供。
  docs: false

auth:
  # 不開放註冊。要開放的話註冊政策要跟配額一起想(見下)。
  # 註:invite 目前的行為等同 closed,邀請碼還沒做(#4)。
  registration: closed
  session_ttl_hours: 168
  # 新帳號進哪個角色。內建的 admin 和 member 權限改不了——它們在每台
  # instance 意思一樣,文件和支援對話才靠得住。想讓一般使用者少做一些事,
  # 就在後台建一個角色,然後把這裡指過去。
  #
  # 這個名字的角色必須存在,否則 server 起不來(而不是等到有人註冊才炸)。
  default_role: member
  password:
    min_length: 12

share:
  # 10 碼而不是 8。這台的取件碼端點暴露在公網上,可以被枚舉,
  # 雖然有節流,但碼長一點的成本是零。
  code_length: 10
  # 沒指定期限時用這個,也就是絕大多數的分享。短期儲存不會累積 —— 你手上握著的
  # 量等於「每天上傳量 × 保存天數」,所以這一個數字對磁碟用量的影響比任何東西
  # 都大,包括配額。
  default_expiry_hours: 72
  # 最長可以指定到 7 天。storage.to 的免費版就是這個數字。
  max_expiry_hours: 168
  # 過期或取完就快點清掉,別替陌生人保管。
  retain_after_death_hours: 24
  # 解鎖之後那張 ticket 能用多久。對外的機器縮短一點,
  # 因為 ticket 可以被轉給別人(見 #45)。
  ticket_ttl_hours: 6

telemetry:
  # 對外的機器通常會把 log 收進 Loki / ELK。
  format: json
  ansi: false
  filter: info

storage:
  url: data/blobs
  # 這台總共最多握著多少內容。0 是不限。
  #
  # 沒有這個的話,匿名上傳開著就等於一顆任何人都能填滿的硬碟,而且第一個徵兆是
  # 寫入開始失敗 —— 那是最糟的發現時機。50 GB 只是一個起點,照你的磁碟改。
  #
  # 只算還存在的內容。已經死掉、只留一列用來回答「這個過期了」的分享,
  # 位元組在死掉當下就被清掉了,不佔這個額度。
  max_total_bytes: 53687091200

database:
  # 單機 SQLite 就夠。要跑多個實例才需要 Postgres。
  url: sqlite://data/tessera.db

# ── 還沒有的東西 ────────────────────────────────────────────────────────
#
# 這件事目前沒有任何設定可以打開,在做出來之前,對外的機器要靠外部手段補:
#
#   惡意軟體掃描(#39)—— 現在完全不掃。匿名 + 免註冊 + 不掃描,
#                        對營運者是真實的法律與濫用風險。
#                        暫時的做法:前面擋一層,或接受這個風險並準備好處理檢舉。
