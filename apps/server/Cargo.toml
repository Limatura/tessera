[package]
name = "tessera-server"
description = "Tessera — anonymous file courier backend (single-binary Rust monolith)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tessera-server"
path = "src/main.rs"

# Emits the OpenAPI contract. Kept as a separate binary so the contract can be
# regenerated in CI without booting a database or a storage backend.
[[bin]]
name = "tessera-openapi"
path = "src/bin/openapi.rs"

[[bench]]
name = "api"
harness = false

[lints]
workspace = true

[features]
# Everything on by default: the product promise is that `docker pull` gives you
# every backend, and nobody should have to rebuild to point at S3. The flags stay
# so that someone building from source for a constrained box can strip back down
# — `--no-default-features --features sqlite,storage-fs` is a much smaller binary.
default = ["sqlite", "postgres", "mysql", "storage-fs", "storage-s3", "storage-gcs", "storage-azure", "storage-http", "email", "og-images"]

# --- data ---
# Each backend pulls in our direct sqlx dependency, which is what pins the TLS
# provider to aws-lc-rs. Routing TLS through sea-orm's `runtime-tokio-rustls`
# instead would select ring — and since cargo features are additive and
# object_store's cloud backends require aws-lc-rs, the binary ended up carrying
# *both* crypto implementations. Only `sqlite` needs sqlx's own driver; the other
# two reach sqlx through sea-orm.
sqlite = ["dep:sqlx", "sqlx/sqlite", "sea-orm/sqlx-sqlite"]
postgres = ["dep:sqlx", "sea-orm/sqlx-postgres"]
mysql = ["dep:sqlx", "sea-orm/sqlx-mysql"]

# --- storage ---
storage-fs = []                            # always available; a flag for symmetry
storage-s3 = ["object_store/aws"]
storage-gcs = ["object_store/gcp"]
storage-azure = ["object_store/azure"]
storage-http = ["object_store/http"]       # WebDAV and plain HTTP stores

# --- link previews ---
# Draws the picture a chat client shows when somebody pastes a share link.
#
# Measured against a blank binary on this project's release profile: takumi with
# `from-html` costs 5.02 MB, and the five embedded faces another 3.29 MB. That is
# the largest single flag here, which is why it is a flag — an instance whose
# links are never pasted anywhere public can turn it off and get the space back.
#
# `from-html` rather than building a node tree in Rust: the layouts are HTML so
# that the editor #12 plans can edit the same source the server renders, instead
# of a preview and a real output drifting apart as two implementations.
#
# `woff2` because the faces are stored compressed — 3.29 MB rather than 9.06 MB
# of TrueType.
#
# Version pinned exactly, not caret: takumi went 2.7.1 to 2.12.0 in thirteen
# days, and `takumi-html` is still 0.x.
og-images = ["dep:takumi", "dep:syntect", "dep:two-face", "dep:html5ever", "dep:markup5ever_rcdom"]

# --- email ---
# On by default, like every other backend, because it costs 37 KB.
#
# Measured: the release binary is 13933 KB without and 13970 KB with. It is that
# small because the TLS stack is already there — `object_store` pulls in rustls
# and a crypto provider whatever happens, so lettre adds only itself.
#
# At that price the flag is not about size, it is about not compiling in a
# dependency somebody building from source has no use for. Whether an instance
# actually sends anything is a *runtime* question: no `mail` block in the
# configuration and the endpoints are not mounted at all.
#
# `aws-lc-rs` rather than `ring` on purpose: sqlx already pins the provider, and
# cargo features are additive — asking for the other one here would put *both*
# crypto implementations in the binary. See the note above the data backends.
#
# `webpki-roots` rather than the OS trust store: the release binary is static
# musl on distroless, and bundled roots behave the same everywhere.
email = [
  "dep:lettre",
  "lettre/smtp-transport",
  "lettre/tokio1-rustls",
  "lettre/aws-lc-rs",
  "lettre/webpki-roots",
  "lettre/builder",
]

[dependencies]
tessera-core = { workspace = true }

# Optional; see the `email` feature for why it is not on by default.
lettre = { version = "0.11", default-features = false, optional = true }

# --- web ---
axum = { version = "0.8.9", features = ["macros", "http2"] }
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "fs",
  "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
  "trace",
  "cors",
  "compression-gzip",
  "compression-br",
  "request-id",
  "timeout",
  "catch-panic",
] }

# --- data ---
# `runtime-tokio`, not `runtime-tokio-rustls`: the latter forwards to
# `sqlx/tls-rustls`, which selects ring. TLS is configured on the sqlx dependency
# below instead, so the whole binary agrees on one crypto provider.
sea-orm = { version = "2.0", default-features = false, features = [
  "macros",
  "runtime-tokio",
  "with-time",
] }
sea-orm-migration = { version = "2.0", default-features = false, features = [
  "runtime-tokio",
] }

# sea-orm normally owns sqlx completely, and for Postgres and MySQL it does.
# SQLite is the exception: `ConnectOptions` exposes pool settings but no way to
# reach `SqliteConnectOptions`, and sqlx's URL parser *rejects* unknown query
# parameters — so `?journal_mode=WAL` is a hard error, not a workaround. Setting
# the pragmas after connecting does not work either: `journal_mode` is persistent
# but `foreign_keys`, `busy_timeout` and `synchronous` are per-connection, and
# pool connections are opened lazily.
#
# So for SQLite we build the sqlx pool ourselves and hand it to sea-orm via
# `SqlxSqliteConnector::from_sqlx_sqlite_pool`. Same sqlx version sea-orm already
# depends on, so cargo unifies it — this adds no second driver stack. Do not
# "clean up" this dependency; see db::connect_sqlite.
# It also owns the TLS choice for the whole binary: `tls-rustls-aws-lc-rs` rather
# than the default ring, so that Postgres/MySQL connections and object_store's
# cloud backends share one crypto implementation instead of linking two.
# `sqlite` is added by the `sqlite` feature, not here.
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
], optional = true }

# --- storage ---
# AES-256-GCM for the backend credentials at rest. Already compiled into this
# binary — it is the TLS provider the whole tree pins (see the note above) — so
# naming it here costs a line, not a dependency.
aws-lc-rs = "1.18"
object_store = { version = "0.14", features = ["fs"] }
# `object_store::parse_url_opts` takes a `Url`; this is the same crate it already
# depends on, so naming it here costs nothing beyond the import.
url = "2"

# PKCE and the parts of an ID token are base64url without padding, which is
# also what the JOSE specifications use everywhere. Already in the tree behind
# other crates; named here because this code reaches for it directly.
base64 = "0.23"

# Talking to an identity provider: fetching its configuration and exchanging an
# authorisation code. Already in the tree through `object_store`, so it brings
# no TLS stack of its own — the same reasoning as `lettre` above.
# `rustls` rather than the default TLS: the crypto provider is already pinned to
# `aws-lc-rs` by sqlx, and cargo features are additive, so asking for the other
# one here would put both implementations in the binary. Same note as the data
# backends above.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }

# --- contract ---
utoipa = { workspace = true }
utoipa-axum = "0.2"
# Scalar rather than Swagger UI. Measured: swagger-ui embeds 16.7 MB of
# unpacked assets — over half of them source maps and `.jsx` sources that serve
# no runtime purpose — which was 11.3 MB of a 23.8 MB binary. utoipa-scalar is
# 11 KB and loads its assets from a CDN.
#
# That trade only works because the docs UI is a development convenience,
# disabled by default (`features.docs`), and a machine doing development has
# outbound network. Vendoring the CDN bundle to make it work offline was
# considered and rejected: it would put a 3.7 MB minified blob in the repository
# that cargo-deny cannot audit and that we would own updating.
utoipa-scalar = { version = "0.3", features = ["axum"] }

# --- serialization ---
serde = { workspace = true }
serde_json = { workspace = true }

# --- errors ---
thiserror = { workspace = true }
anyhow = "1"

# --- observability ---
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
  "registry",
] }

# Layered configuration. Environment variables only now that the panel owns
# every setting a running instance can change — see `settings.rs` for where the
# line is drawn and why the file layer went.
figment = { version = "0.10", features = ["env"] }

# --- authentication ---
# Argon2id is OWASP's current recommendation for password storage. The `std`
# feature brings the PHC string format, so a stored hash carries its own
# parameters and a future change to them does not invalidate existing passwords.
argon2 = { version = "0.5", features = ["std"] }
# Session and API tokens are high-entropy random values, so they are stored under
# a fast hash rather than Argon2: there is nothing to brute-force, and paying
# ~50 ms of key derivation on every authenticated request would be absurd.
sha2 = "0.11"
# Constant-time comparison, for the one place a secret is compared in process.
subtle = "2"
# Cookie jar extractor. `cookie-private`/`cookie-signed` are deliberately not
# enabled: the session cookie carries an opaque random token that means nothing
# without the database row, so signing it would protect nothing.
axum-extra = { version = "0.12", features = ["cookie"] }

# --- misc ---
# CIDR matching, for deciding whether the thing that connected is a proxy we
# said we trust. Already in the tree through reqwest, so it costs nothing new,
# and hand-rolling prefix comparison across v4 and v6 is exactly the kind of
# thing that looks right and is not.
ipnet = "2"
parking_lot = "0.12"
rust-embed = "8.12"
# Pinned exactly rather than with a caret: see the `og-images` feature note.
# Pinned exactly rather than with a caret: see the `og-images` feature note.
#
# The explicit feature list saves no bytes — measured, it came out 64 larger
# than the default set, because link-time optimisation already drops the JPEG,
# WebP and GIF decoders nothing calls. It is here for the compile time and to
# say what is actually used. `svg-source` is not used either: `raster-backend`
# on its own does not compile, and has not since 0.4.13 — `node_paint.rs` looks
# for a `draw_image` that only another feature defines. Upstream bug, still
# present in 0.4.21.
# Checking an operator's own card layout before it is drawn.
#
# Already in the tree — `takumi-html` parses with them — but reached directly
# here, because what is being checked is which elements and attributes a layout
# uses, and takumi hands back a laid-out node tree with that question already
# answered and thrown away.
html5ever = { version = "0.39", optional = true }
markup5ever_rcdom = { version = "0.39", optional = true }

# Syntax colouring for the card a text share gets.
#
# `two-face` rather than syntect's own set, which has 75 syntaxes and does not
# include TypeScript — nor TOML, Kotlin, Swift, Zig, Dockerfile or Nix. Measured
# against a blank binary on the release profile: syntect alone is 1.82 MB and
# 75 languages, with two-face 2.39 MB and 199.
#
# `regex-fancy` rather than `regex-onig`: the oniguruma backend is a C library,
# and this binary is static musl on distroless.
#
# One thing to know about the cost: the first card in a given language pays for
# compiling that syntax's regexes — measured at 405 ms for TypeScript — and
# every card after it is 1.3 ms. It is per process, not per request, and the
# thing waiting is a crawler.
syntect = { version = "5", default-features = false, features = [
  "regex-fancy",
  "parsing",
], optional = true }
two-face = { version = "0.4", default-features = false, features = [
  "syntect-fancy",
], optional = true }

takumi = { version = "=2.12.0", default-features = false, features = [
  "raster-backend",
  "from-html",
  "woff2",
  "svg-source",
], optional = true }
mime_guess = "2"
bytes = "1"
# `BodyExt::frame` is how the upload path reads a request body one chunk at a
# time. The alternative is `futures-util` for `StreamExt::next`, which is a much
# larger crate for one method — this one is a thin layer over the `http-body`
# traits axum already uses.
# Writing the archive stream as a loop rather than a hand-rolled state machine.
# The nested "for each file, for each chunk" shape is what `unfold` makes
# unreadable.
async-stream = "0.3"
# `StreamExt::next`, for walking the object store's chunks while building an
# archive. `futures-util` would do it too and is deliberately not a dependency
# of the server — see the note on `http-body-util`; this one is already in the
# tree through tokio.
tokio-stream = "0.1"
http-body = "1"
http-body-util = "0.1"
ulid = { workspace = true }
time = { workspace = true }
# Reading a password without echoing it. The alternative is `tcsetattr` through
# `libc`, which `unsafe_code = "forbid"` rules out, and `stty -echo`, which the
# distroless runtime image has no shell to run. Small enough not to contradict
# what the CLI module says about dependencies: this is two files, not `clap`.
rpassword = "7.5.4"
# Swapping the whole configuration behind a pointer, so a change made in the
# admin panel reaches the next request without a restart. A `RwLock` would do
# the same job and make every read of every setting take a lock — on the request
# path, for a value that changes once a month.
arc-swap = "1.9.1"

[dev-dependencies]
# The test double in `tests/common/brimming.rs` implements `ObjectStore`, which
# `object_store` declares with `#[async_trait]`.
async-trait = "0.1"
criterion = { version = "0.8", features = ["async_tokio"] }
# `Jail` lets the environment-override tests set variables in a scoped, restored
# way instead of calling `std::env::set_var`, which is unsound under a threaded
# test runner (and banned in clippy.toml).
figment = { version = "0.10", features = ["test"] }
# Only the tests need to drain a stream — `object_store::list` returns one. The
# server itself deliberately avoids this crate; see the `http-body-util` note.
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
insta = { version = "1.48", features = ["json", "redactions"] }
proptest = "1.11"
rstest = "0.26"
tempfile = "3"
