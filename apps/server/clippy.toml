msrv = "1.97"

# `clippy::unwrap_used` / `expect_used` / `panic` are denied crate-wide in src/lib.rs.
# These switches scope that denial to non-test code, which is the exemption the
# standard asks for — and they do it via clippy configuration rather than sprinkling
# `#[allow(...)]` over every test module.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = false

# Keep handlers and assembly functions small enough to read in one screen.
# Default is 128. `figment::Error` is 208 bytes and appears in figment's own
# callback signatures (`Jail::expect_with`), which we cannot box. Our own error
# types stay small — `ConfigError::Source` boxes the figment error precisely so
# that this relaxation is not load-bearing for crate code.
large-error-threshold = 256

cognitive-complexity-threshold = 15
too-many-arguments-threshold = 6
type-complexity-threshold = 250

# Product names that `clippy::doc_markdown` would otherwise demand backticks
# around. `..` keeps clippy's own default list.
doc-valid-idents = ["OpenAPI", "SQLite", "MinIO", "UUIDv4", "ShareX", "FileCodeBox", ".."]

disallowed-methods = [
  { path = "std::env::set_var", reason = "mutating the process environment is unsound in a multi-threaded runtime; load configuration through config.rs instead" },
]
disallowed-types = [
  { path = "std::sync::Mutex", reason = "use parking_lot::Mutex — no poisoning, smaller, faster" },
  { path = "std::sync::RwLock", reason = "use parking_lot::RwLock — no poisoning, smaller, faster" },
]
