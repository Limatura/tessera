[package]
name = "tessera-cli"
description = "Send and fetch Tessera shares from a terminal, end-to-end encrypted when asked"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tess"
path = "src/main.rs"

# A client, so the opposite trade-off from the server: the server counts every
# dependency against one small binary, while this is for people typing
# commands, where a self-explanatory `--help` is the product.
[dependencies]
# Styled output that turns itself off for pipes and `NO_COLOR`; clap uses both.
anstream = "1.0"
anstyle = "1.0"
base64ct = { version = "1.8", features = ["alloc"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
# `tess ui`. `event-stream` so keys and the network wait in one `select!`.
crossterm = { version = "0.29", features = ["event-stream"] }
# Where the config file goes: `~/.config` on Linux and macOS alike.
etcetera = "0.11"
futures-util = "0.3"
getrandom = "0.4"
# A QR code as a picture, for terminals that draw them. No formats to read.
image = { version = "0.25", default-features = false }
# The walk behind `tess ui`'s search, skipping what `.gitignore` skips.
ignore = "0.4.33"
# Fuzzy matching for that search, as fzf and Helix do it.
nucleo-matcher = "0.3.1"
# Only the matrix and its text rendering; no image formats.
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
# Pictures through kitty, sixel or iTerm2 graphics, where the terminal has one.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
# `rustls` for the same reason the server gives: no system OpenSSL to find.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7.5"
serde = { workspace = true }
serde_json = { workspace = true }
tessera-crypto = { workspace = true }
tessera-metadata = { workspace = true }
thiserror = { workspace = true }
# `local-offset` for showing an expiry as this machine's clock reads it.
time = { workspace = true, features = ["local-offset"] }
toml = "1.1"
# How many cells a character takes, for copying text off the screen.
unicode-width = "0.2"
tokio = { version = "1.53", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "time"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
# Reads the drawn QR code back, as a phone would.
rqrr = "0.11"
axum = "0.8.9"
tempfile = "3"
tessera-server = { path = "../server" }

[lints]
workspace = true
