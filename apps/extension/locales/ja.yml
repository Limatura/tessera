signIn:
  action: ログイン
  doneTitle: ログインしました
  done: $1 としてログインしました
  failedTitle: ログインに失敗しました
  noUploadPermission: このアカウントにはアップロード権限がありません。管理者に問い合わせてください。
  noTokenPermission: このアカウントは API キーを作成できないため、拡張機能が自動でログインできません。管理者に「API キーの管理」権限を依頼するか、キーを手動で貼り付けてください。
  badToken: このキーは受け付けられませんでした。すべてコピーされているか、失効していないか確認してください。
