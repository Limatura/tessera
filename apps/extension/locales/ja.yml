errors:
  noServerTitle: サーバーが未設定です
  noServer: 先に拡張機能の設定で Tessera の URL を入力してください。
  signInRequired: このサーバーは匿名アップロードを受け付けていません。先にログインしてください。
  network: サーバーに接続できません。URL とネットワーク接続を確認してください。
  mediaBlocked: このサイトからファイルを取得できませんでした。拡張機能の設定で「任意のサイトからメディアを取得」を有効にしてから再試行してください。
  mediaTooLarge: ファイルが大きすぎてページから直接取り出せません。拡張機能の設定で「任意のサイトからメディアを取得」を有効にしてください。
  mediaStream: ストリーミング再生のメディアのため、ダウンロードできる完全なファイルがありません。
  mediaHttp: サイトがこのファイルの提供を拒否しました(HTTP $1)。
  interrupted: ブラウザによってアップロードが中断されました。もう一度アップロードしてください。
  unknownTitle: エラーが発生しました
  unknown: 予期しないエラーが発生しました。

