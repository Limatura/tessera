[package]
name = "tessera-dev"
description = "Stand-ins for the outside services Tessera talks to, for trying it out locally"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "tessera-dev"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23"
getrandom = "0.4"
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal"] }

[lints]
workspace = true
