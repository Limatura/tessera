[store]
dir = "target/nextest"

# Tests in `tests/backends.rs` all point at one external database, so they are
# not independent the way the rest of the suite is. Running them concurrently on
# a *fresh* database makes four processes race to create `seaql_migrations`, and
# Postgres rejects the losers with a duplicate-key error on `pg_type`.
#
# That failure only appears on the first run against a new database, which is
# exactly the CI case — and never on a second local run, which is exactly how it
# hides from you.
[test-groups]
shared-database = { max-threads = 1 }

[profile.default]
# A test that takes longer than this is almost certainly hung on I/O.
slow-timeout = { period = "20s", terminate-after = 3 }
failure-output = "immediate-final"
fail-fast = false
status-level = "fail"
final-status-level = "slow"

[[profile.default.overrides]]
filter = 'binary(backends)'
test-group = 'shared-database'

[profile.ci]
# Retries absorb genuinely flaky network/filesystem timing on shared runners.
# They do not absorb deterministic failures — those still fail the run. Note that
# retries are not what makes the backend suite pass: serialising it is.
retries = { backoff = "exponential", count = 2, delay = "1s", jitter = true }
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"
fail-fast = false
status-level = "retry"

[[profile.ci.overrides]]
filter = 'binary(backends)'
test-group = 'shared-database'

[profile.ci.junit]
path = "junit.xml"
