# tessera — 個人用的範例設定
#
# 情境:架在自己的 NAS 或家用伺服器上,只有你(和你信任的人)碰得到,
# 通常在區網內或 VPN 後面。什麼都想丟進去,不太需要防誰。
#
# 用法:複製成 tessera.yaml 放在執行檔旁邊,或用 TESSERA_CONFIG_FILE 指過來。
# 沒寫到的設定會用內建預設值,所以這份很短是刻意的 —— 只列跟預設不一樣的。
#
# 每一項也都可以用環境變數給:前綴 TESSERA_,巢狀用 __ 分隔,
# 例如 share.max_expiry_hours -> TESSERA_SHARE__MAX_EXPIRY_HOURS=8760。
# 環境變數贏過這個檔案。

server:
  # 容器裡要綁 0.0.0.0,不然只有容器自己連得到。
  # 直接跑在主機上而且前面有反向代理的話,127.0.0.1 比較安全。
  host: 0.0.0.0

features:
  # 不用先登入就能上傳。這台只有你碰得到,每次都要登入很煩。
  # ⚠ 如果這台會被公網打到,把這個關掉,或改用 tessera.public.yaml。
  anonymous_upload: true
  # 你就是開發者也是營運者,把 API 參考頁打開會方便很多。
  # 渲染器是從 CDN 拉的,伺服器本身不對外抓東西。
  docs: true

auth:
  # 不開放註冊。要多開帳號的話自己在後台加。
  registration: closed

share:
  # 一年。你自己付硬碟的錢,而且個人用的東西常常是「先丟著」。
  # 注意目前沒指定期限時會直接用這個上限當預設值(見 #34),
  # 所以這個數字同時也是「隨手上傳」的保存期。
  max_expiry_hours: 8760
  # 過期或取完之後還留多久才真的刪掉。留一週,誤刪了還有得救。
  retain_after_death_hours: 168

storage:
  # 換成 S3 / B2 / MinIO 的話:
  #   url: s3://my-bucket/tessera
  #   options:
  #     endpoint: http://minio.lan:9000
  #     access_key_id: ...
  #     secret_access_key: ...
  url: data/blobs

database:
  url: sqlite://data/tessera.db
