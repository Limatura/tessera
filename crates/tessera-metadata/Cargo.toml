[package]
name = "tessera-metadata"
description = "Removes the metadata a photo carries, its location above all, before it is shared"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Built natively for the command line, and later to WebAssembly for the browser,
# so like `tessera-crypto` it reaches for nothing outside the bytes it is given.
[dependencies]
crc32fast = "1.5"
thiserror = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[lints]
workspace = true
