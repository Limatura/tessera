version: 2
updates:
  # Every action in the workflows is pinned to a commit SHA, because a tag can be
  # moved and a compromised upstream repository then means arbitrary code in CI
  # (zizmor's `unpinned-uses`). Pinning is only safe if somebody moves the pins —
  # otherwise the workflows quietly freeze on whatever was current the day they
  # were written. Dependabot bumps the SHA and the trailing `# vX` comment
  # together, so the pin stays readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # `cargo deny` in the security job only refuses *known advisories*. This is the
  # ordinary version drift it says nothing about. Grouped so that a quiet week of
  # patch releases arrives as one pull request rather than a dozen.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # `utoipa-axum` and `utoipa-scalar` each require the `utoipa` major they
    # were built for, so bumped one at a time none of them compiles.
    groups:
      utoipa:
        patterns: ["utoipa*"]
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # `markup5ever_rcdom` requires `html5ever` 0.39, and the two must agree.
      # Drop this once it has a release for the newer one.
      - dependency-name: html5ever
        versions: [">=0.40"]

  # The web app and the shared packages. One pnpm workspace, so one entry at the
  # root covers every `package.json` in it, and the catalog in
  # `pnpm-workspace.yaml` is bumped in place.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
