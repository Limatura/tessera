version: 2
updates:
  # Every action in the workflows is pinned to a commit SHA, because a tag can be
  # moved and a compromised upstream repository then means arbitrary code in CI
  # (zizmor's `unpinned-uses`). Pinning is only safe if somebody moves the pins —
  # otherwise the workflows quietly freeze on whatever was current the day they
  # were written. Dependabot bumps the SHA and the trailing `# vX` comment
  # together, so the pin stays readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # `cargo deny` in the security job only refuses *known advisories*. This is the
  # ordinary version drift it says nothing about. Grouped so that a quiet week of
  # patch releases arrives as one pull request rather than a dozen.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
