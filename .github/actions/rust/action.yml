name: Rust toolchain
description: >-
  Installs the pinned toolchain and restores the build cache for one kind of build.

inputs:
  cache-key:
    description: >-
      Jobs that compile the same thing share a key, so one cache serves them
      all. Different feature sets or profiles get their own.
    required: true
  save-cache:
    description: Whether this job may write the cache. Only main writes it either way.
    default: "true"

runs:
  using: composite
  steps:
    # `rust-toolchain.toml` is what pins the version. This only makes rustup act
    # on it now, so the first `cargo` call is not the thing that downloads a
    # compiler in the middle of a timed step, and so the cache below is keyed on
    # the right compiler.
    - name: Materialise the pinned toolchain
      shell: bash
      run: rustup show active-toolchain || rustup show

    # Saved from main only. A pull request reads main's cache and writes none,
    # so pull requests do not each store a copy and push main's out of the 10 GB
    # the repository gets.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save-cache == 'true' }}
        # Tools come from taiki-e/install-action, pinned per job.
        cache-bin: "false"

    # `build.rs` watches `apps/web/dist`, and a watched path that does not exist
    # reruns it on every cargo call, which recompiles the server each time. Jobs
    # here never build the web app, so an empty one stands in; build.rs serves
    # its placeholder for an empty directory as for a missing one.
    - name: Give build.rs a web bundle directory to watch
      shell: bash
      run: mkdir -p apps/web/dist
