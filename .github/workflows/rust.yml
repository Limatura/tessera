name: rust

# Deliberately separate from the TypeScript pipeline and outside Turborepo:
# the two toolchains share no cache, no dependency graph and no failure modes,
# and coupling them would make every frontend PR wait on a Rust rebuild.
on:
  push:
    branches: [main]
    paths: &rust-paths
      - "apps/server/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - "openapi.json"
      # Every workflow, not just this one: the `workflows` job below lints all
      # of them with actionlint and zizmor, and it is the only place that does.
      # Without this a change to `web.yml` would ship unchecked.
      - ".github/workflows/**"
  pull_request:
    paths: *rust-paths
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Outside the checkout on purpose. `actions/checkout` cleans the workspace at
  # the start of every run, so a target directory inside it is a cache that
  # gets deleted before it is ever read — which on one machine is the difference
  # between a two-minute run and a twenty-minute one. `_work` is the runner's
  # own directory and survives.
  CARGO_TARGET_DIR: ${{ github.workspace }}/../.cargo-target
  # A build that has to redo work is slow; one that keeps every intermediate
  # from every branch fills a disk. Measured locally: 28 GB of incremental
  # artefacts against 4.5 GB of actual output.
  CARGO_INCREMENTAL: "0"
  # Lint levels in Cargo.toml are `warn` so that local development is never
  # blocked mid-experiment. This is where they become blocking.
  RUSTFLAGS: -D warnings

# Read-only by default. Nothing here writes to the repository: the checks
# report through the run's own status, and the one artefact goes to
# `upload-artifact`, which needs no repository scope. Granting less than the
# default means a compromised action in this graph — and there are eight
# third-party ones — cannot push, tag, or open anything.
permissions:
  contents: read

# Nothing from a fork runs here, and that guard exists before it is needed.
#
# These jobs run on a machine somebody owns, in their house. On a private
# repository only people with access can start one. The day this repository goes
# public, `pull_request` becomes an invitation for a stranger to run a build
# script of their choosing on that machine — GitHub's own documentation says not
# to pair self-hosted runners with public repositories for exactly this reason.
#
# A pull request from a branch in this repository still runs, which is every
# pull request today. One from a fork does not run at all, which is visible as a
# skipped check rather than a silent pass.
jobs:
  # Six checks that were six jobs until they were measured. They all read the
  # same build output, so splitting them meant paying for a checkout, a toolchain
  # step and a fresh look at the target directory six times over. On one runner
  # that overhead is serial, and it was about half of what those jobs cost:
  # 101 seconds across six jobs, of which the work itself was a few seconds each.
  #
  # A step keeps its own status inside the job, so a red build still says which
  # check failed. What is lost is five tick marks on the pull request.
  checks:
    name: checks
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with: { tool: "cargo-deny,cargo-machete" }

      # rustfmt.toml uses import grouping, which is still nightly-gated. The
      # pinned stable toolchain builds and lints; only formatting needs nightly.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: fmt
        run: cargo +nightly fmt --all --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # The module docs carry this project's architectural reasoning, so a broken
      # intra-doc link is a real defect. `[workspace.lints.rustdoc]` flags them;
      # this is what actually runs rustdoc to find out.
      - name: rustdoc
        run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

      # The contract is generated, never hand-edited. Regenerating it here and
      # diffing against the committed file is what stops the frontend and the
      # Discord bot from generating clients against a stale spec.
      - name: Regenerate openapi.json
        run: cargo run --locked --bin tessera-openapi

      - name: Fail if the contract drifted
        run: |
          if ! git diff --exit-code -- openapi.json; then
            echo "::error::openapi.json is out of date. Run 'pnpm server:openapi' and commit the result."
            exit 1
          fi

      # The same arrangement as the contract above, for the same reason. A
      # generated diagram is only worth having if it cannot be stale, and the
      # thing that goes stale is not the diagram — it is somebody's memory of
      # which tables exist.
      - name: Regenerate the schema docs
        run: python3 scripts/schema-docs.py

      # `git status` rather than `git diff`, because a new table writes a new
      # file and `git diff` does not see untracked ones — which is the drift
      # most worth catching.
      - name: Fail if the schema docs drifted
        run: |
          if [ -n "$(git status --porcelain -- docs/schema)" ]; then
            git status --short -- docs/schema
            echo "::error::docs/schema is out of date. Run 'python3 scripts/schema-docs.py' and commit the result."
            exit 1
          fi

      # cargo-deny covers advisories, licences, banned crates and sources.
      # cargo-audit is deliberately absent — see the comment in deny.toml.
      - name: security and licences
        run: cargo deny check

      - name: unused dependencies
        run: cargo machete

      # `tessera-core` holds the domain rules and must not learn about HTTP, SQL
      # or async IO. Its Cargo.toml already omits them, but a banned crate can
      # still arrive transitively through something innocuous — which is exactly
      # the case review would miss. Walk the resolved tree instead of trusting
      # the manifest.
      - name: Assert no IO crate reaches tessera-core
        run: |
          cargo tree -p tessera-core --edges normal --prefix none \
            | sed 's/ v[0-9].*//' | sort -u > /tmp/core-deps.txt
          status=0
          for banned in axum tokio sea-orm sqlx object_store hyper reqwest figment; do
            if grep -qx "$banned" /tmp/core-deps.txt; then
              echo "::error::\`$banned\` reached tessera-core. The domain crate must stay IO-free."
              cargo tree -p tessera-core --edges normal -i "$banned" || true
              status=1
            fi
          done
          echo "tessera-core depends on $(wc -l < /tmp/core-deps.txt) crates"
          exit $status

  features:
    name: feature matrix
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with: { tool: cargo-hack }

      # Every backend is `#[cfg]`-gated. Checking only the empty and full sets
      # leaves the middle combinations unbuilt — which is where a missing `cfg`
      # hides. `--depth 2` keeps the run bounded while still pairing backends.
      #
      # No `--locked` here, and it is not an oversight: `--no-dev-deps` works by
      # rewriting the real manifest while cargo runs, which cargo then wants to
      # reflect in the lock file — and `--locked` exists precisely to forbid that,
      # so the two cancel out ("cannot update the lock file because --locked was
      # passed"). The lock file is still pinned in CI; every other job asserts it.
      - run: cargo hack --feature-powerset --depth 2 --no-dev-deps check -p tessera-server

  test:
    name: test
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with: { tool: cargo-nextest }

      - run: cargo nextest run --locked --workspace --profile ci --all-features

      # Copied into the workspace first. `upload-artifact` refuses a path
      # containing `..`, and the target directory lives outside the checkout so
      # that `actions/checkout` does not delete it between runs.
      - name: Collect the test report
        if: always()
        run: cp "$CARGO_TARGET_DIR/nextest/ci/junit.xml" junit.xml || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit
          path: junit.xml
          if-no-files-found: ignore

  backends:
    name: ${{ matrix.backend }} backend
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Without this job, `postgres` and `mysql` are only ever proven to *compile*.
    # The hand-written per-dialect migration SQL especially needs a real server:
    # "sqlite was updated and the others were forgotten" is the failure mode that
    # choosing readable SQL over a schema builder buys, and this is the price.
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            url: postgres://tessera:tessera@localhost:5432/tessera_test
          - backend: mysql
            url: mysql://tessera:tessera@localhost:3306/tessera_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports: ["5432:5432"]
        # `pg_isready` alone reports ready during initdb, before the role and
        # database exist — naming both is what makes the probe mean something.
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera_test" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: tessera
          MYSQL_PASSWORD: tessera
          MYSQL_DATABASE: tessera_test
        ports: ["3306:3306"]
        # Likewise: `mysqladmin ping` answers long before the user is created,
        # so the probe runs a real query as the user the tests will use.
        options: >-
          --health-cmd "mysql -utessera -ptessera -e 'SELECT 1' tessera_test" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with: { tool: cargo-nextest }

      # These tests are `#[ignore]`d so a plain `cargo nextest run` does not
      # demand a database; `--run-ignored all` is what opts into them.
      - name: Run the backend suite
        env:
          TESSERA_TEST_DATABASE_URL: ${{ matrix.url }}
        run: |
          cargo nextest run --profile ci --all-features \
            --run-ignored all -E 'binary(backends)'

  workflows:
    name: workflow lint
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust

      # `actionlint` reads the workflow the way the runner will: unknown keys,
      # expressions that cannot evaluate, shell that `shellcheck` dislikes. All
      # of it is otherwise found by pushing and watching a run go red.
      # From its own image rather than through a wrapper action. The wrapper
      # picks a binary from the platform it thinks it is on, and on this runner
      # it decided "unsupported" — a question that does not arise when the tool
      # ships as a container.
      #
      # Pinned to a version that resolves YAML anchors. `paths: *rust-paths` is
      # what keeps the trigger lists for push and pull_request from drifting
      # apart, and 1.7.7 reads the alias as a syntax error.
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color .github/workflows/*.yml

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with: { tool: zizmor }

      # `zizmor` audits the workflow as an attack surface. The finding it exists
      # for here is the one this file had until now: every `uses:` named a tag,
      # and a tag is a label the action's author can move. Pinning to a commit
      # means an upstream account compromise cannot silently change what runs
      # with this repository's token.
      - name: zizmor
        run: zizmor .github/workflows/

  docker:
    name: docker image
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/server/Dockerfile
          tags: tessera-server:ci
          load: true
          # On disk, not in GitHub's cache. The runner is one machine that keeps
          # its filesystem between runs, so a layer cache costs nothing to keep
          # and nothing to fetch — where `type=gha` would upload gigabytes to the
          # place we moved off in the first place. The size cap is enforced by
          # the prune step below, not here.
          cache-from: type=local,src=/tmp/tessera-buildx-cache
          cache-to: type=local,dest=/tmp/tessera-buildx-cache,mode=max
          # `.git` is not in the build context, so the commit has to be passed in
          # or `/health` reports `unknown`.
          build-args: |
            TESSERA_BUILD_REV=${{ github.sha }}

      # "Functional, but not bloated" is a product decision, not a taste. Once it
      # is a number the build enforces, adding a dependency becomes a concrete
      # question — is this feature worth 3 MB? — instead of an argument.
      #
      # The rootfs is measured with `docker export`, which flattens the container
      # filesystem: unlike `docker image inspect`, it means the same thing whether
      # the daemon uses the classic or the containerd image store.
      - name: Enforce the footprint budget
        run: |
          # A smoke alarm, not a product constraint. Twenty megabytes is not a
          # size anybody self-hosting notices: the images this sits next to run
          # from about 30 MB for FileBrowser to a gigabyte for Nextcloud, the
          # binary is mapped rather than read so unused pages cost no memory,
          # and on a NAS the disk is not the scarce thing. What this catches is
          # growth nobody meant — a dependency that dragged in a toolchain, a
          # frontend bundle that quietly went up fivefold.
          #
          # Which means the numbers want headroom, and the previous ones did
          # not. They were set a quarter above what was measured on 2026-08-12,
          # and by 2026-08-17 the actual was 18 and 21 — exactly the budget, so
          # the next change of any size would have failed on somebody else's
          # growth. An alarm that goes off every time teaches people to raise it
          # without reading it, and then it is silent on the day it matters.
          #
          # These leave about half. That is loose enough to sit still through
          # ordinary work and tight enough that a doubling still says something.
          BINARY_BUDGET_MB=28
          ROOTFS_BUDGET_MB=32

          cid=$(docker create tessera-server:ci)
          docker cp "$cid:/usr/local/bin/tessera-server" /tmp/tessera-server
          rootfs=$(docker export "$cid" | wc -c)
          docker rm "$cid" > /dev/null

          binary=$(stat -c%s /tmp/tessera-server)
          binary_mb=$(( binary / 1000000 ))
          rootfs_mb=$(( rootfs / 1000000 ))

          echo "binary : ${binary_mb} MB (budget ${BINARY_BUDGET_MB} MB)"
          echo "rootfs : ${rootfs_mb} MB (budget ${ROOTFS_BUDGET_MB} MB)"
          echo "pull   : $(docker image inspect tessera-server:ci --format '{{.Size}}' | awk '{printf "%.1f MB", $1/1000000}') as reported by this daemon"

          status=0
          if [ "$binary_mb" -gt "$BINARY_BUDGET_MB" ]; then
            echo "::error::binary is ${binary_mb} MB, over the ${BINARY_BUDGET_MB} MB budget"
            status=1
          fi
          if [ "$rootfs_mb" -gt "$ROOTFS_BUDGET_MB" ]; then
            echo "::error::image rootfs is ${rootfs_mb} MB, over the ${ROOTFS_BUDGET_MB} MB budget"
            status=1
          fi
          exit $status

      - name: Smoke-test the image
        run: |
          docker run -d --name tessera-smoke -p 8787:8787 tessera-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health > /dev/null; then
              echo "health check passed"
              curl -fsS http://localhost:8787/openapi.json > /dev/null
              # The commit must reach the binary, or bug reports lose their anchor.
              rev=$(curl -fsS http://localhost:8787/health | grep -o '"build_rev":"[^"]*"')
              echo "reported ${rev}"
              case "$rev" in *unknown*)
                echo "::error::build_rev is 'unknown' — the build arg did not reach build.rs"
                exit 1 ;;
              esac
              docker rm -f tessera-smoke
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container never became healthy"
          docker logs tessera-smoke
          exit 1

      # This job builds an image and loads it into the daemon. On a hosted
      # runner the daemon went away with the machine; here it does not, and a
      # tagged image survives `docker image prune`, which only takes dangling
      # ones. So the job that made it takes it away — including when the smoke
      # test failed and left the container behind.
      - name: Remove what this job put on the machine
        if: always()
        run: |
          docker rm -f tessera-smoke 2>/dev/null || true
          docker image rm -f tessera-server:ci 2>/dev/null || true
          docker image prune -f

  fuzz:
    name: contract fuzz
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v6

      - run: cargo build --locked --bin tessera-server

      # SQLite in a temporary directory: this instance is written to, filled with
      # generated rubbish, and thrown away.
      - name: Start an instance and seed it
        id: instance
        run: |
          mkdir -p /tmp/fuzz
          TESSERA_DATABASE__URL='sqlite:///tmp/fuzz/fuzz.db?mode=rwc' \
          TESSERA_STORAGE__URL=/tmp/fuzz/blobs \
          TESSERA_SERVER__PORT=13999 \
            "$CARGO_TARGET_DIR/debug/tessera-server" > /tmp/fuzz/server.log 2>&1 &
          echo $! > /tmp/fuzz/server.pid
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:13999/health > /dev/null 2>&1 && break
            sleep 0.5
          done
          .github/scripts/fuzz-seed.sh http://127.0.0.1:13999 /tmp/fuzz/server.log > /tmp/fuzz/seed.env
          # The token is a real credential for the life of this job. Masking it
          # keeps it out of the log if a later step ever echoes its inputs.
          echo "::add-mask::$(grep '^token=' /tmp/fuzz/seed.env | cut -d= -f2-)"
          cat /tmp/fuzz/seed.env >> "$GITHUB_OUTPUT"

      # The credentials go in the config rather than through `-H`, and the
      # difference matters: given `-H`, Schemathesis cannot tell a header it was
      # handed from one the API requires, so its `ignored_auth` check strips the
      # session cookie, leaves the bearer token in place, and reports every
      # authenticated endpoint as an authentication bypass. Naming the security
      # scheme lets it remove the whole credential and mean what it says.
      #
      # The seeded share is not named here: `POST /shares` declares OpenAPI
      # links to the three `{code}` operations, so the stateful phase chains
      # create into describe on its own. What the seed still buys is a populated
      # `GET /shares` — an empty list conforms to any schema, so a response with
      # rows in it is the only one that checks anything.
      - name: Compose the run configuration
        # Through `env` rather than `${{ }}` inside the script: an expression is
        # substituted before the shell sees the line, so its value becomes part
        # of the program (zizmor `template-injection`).
        env:
          TOKEN: ${{ steps.instance.outputs.token }}
        run: |
          cp .config/schemathesis.toml /tmp/fuzz/run.toml
          printf '\n[auth.openapi.bearer]\nbearer = "%s"\n' "$TOKEN" >> /tmp/fuzz/run.toml

      - name: Schemathesis
        run: |
          uvx schemathesis --config-file /tmp/fuzz/run.toml \
            run http://127.0.0.1:13999/openapi.json \
            -w 4 --report-junit-path /tmp/fuzz/report.xml

      # The runner is one machine that keeps running after the job ends, so a
      # server started here outlives it and the next run finds port 13999 taken.
      # On a hosted runner the whole machine went away and nobody noticed.
      - name: Stop the instance
        if: always()
        run: |
          [ -f /tmp/fuzz/server.pid ] && kill "$(cat /tmp/fuzz/server.pid)" 2>/dev/null || true
          rm -rf /tmp/fuzz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: schemathesis-report
          path: |
            /tmp/fuzz/report.xml
            /tmp/fuzz/server.log
          retention-days: 7
