name: secrets

# Separate from the other workflows for the same reason `web.yml` is separate
# from `rust.yml`: this has nothing in common with either toolchain's cache or
# dependency graph, and a leaked-secret scan should never wait behind a
# frontend or Rust build.
#
# On a PR, only the commits introduced by the PR are scanned (`--log-opts`
# range below) — scanning the full history on every PR would re-flag secrets
# already accepted/rotated on `main` and make the check useless as a gate.
# The `push` trigger on `main` instead does a full-history scan so a secret
# that lands via a squash-merge (which collapses the PR's commits into one
# and can hide what `--log-opts` would have caught) still gets caught once.
#
# Betterleaks, not Gitleaks: same authors, config format carries over, but it
# adds CEL-based candidate filtering and live-credential validation that cut
# false positives. There's no official GitHub Action (unlike gitleaks-action),
# so this runs the official container image directly.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/betterleaks/betterleaks:v1.8.1@sha256:8b9d12db5e11ca798029da44923503de5d8cfff6992cffaaa6722fbeb9fc7797
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: required both for the full scan on `main` and so
          # `--log-opts` below can resolve the PR's base commit on push.
          fetch-depth: 0

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Scan (PR range)
        if: github.event_name == 'pull_request'
        run: >-
          betterleaks git . --config .betterleaks.toml --redact --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan (full history)
        if: github.event_name != 'pull_request'
        run: betterleaks git . --config .betterleaks.toml --redact
