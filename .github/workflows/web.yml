name: web

# Separate from `rust.yml` and outside the Rust pipeline for the same reason
# that one says: the two toolchains share no cache, no dependency graph and no
# failure modes, so a frontend change should not wait on a Rust rebuild.
on:
  push:
    branches: [main]
    paths: &web-paths
      - "apps/web/**"
      - "apps/admin/**"
      - "apps/tui/**"
      - "apps/extension/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "oxlint.config.ts"
      - "oxfmt.config.ts"
      - ".github/workflows/web.yml"
      # The scripts the bundle-size report shells out to. Without this a
      # change to either could ship without ever having been run.
      - ".github/scripts/bundle-size.sh"
      - ".github/scripts/bundle-size-finalize.sh"
      - ".github/scripts/pr-comment.sh"
  pull_request:
    paths: *web-paths
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: types & lint
    runs-on: [self-hosted, Linux, X64]
    # One runner, one slot: a job that hangs holds up everything behind it.
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Read by `bundle-size-comment`.
    outputs:
      report: ${{ steps.bundle-size.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` is what catches a dependency that was imported but
      # never declared: it refuses to update the lock file, so the install fails
      # instead of quietly resolving from the store.
      - run: pnpm install --frozen-lockfile

      # Order matters, and it is the reason this job did not exist for so long.
      # `paraglide`'s runtime and `routeTree.gen.ts` are produced by Vite
      # plugins at build time and are both gitignored, so on a fresh checkout
      # `tsc` cannot resolve `@/paraglide/runtime.js` and reports a dozen errors
      # that say nothing about the code. Build first, then check.
      - run: pnpm turbo run build --filter=web --filter=admin

      # The point of this job. `vite build` hands the file to esbuild, which
      # strips types without checking them — a build that passes says nothing
      # about whether the types are right.
      - run: pnpm turbo run check-types --filter=web --filter=admin

      # apps/docs is a separate git submodule (tessera-docs) with its own
      # oxlint config. --disable-nested-config stops oxlint from walking into
      # it and tripping over whatever config files live there — including a
      # stale one that once conflicted with its current oxlint.config.ts.
      - run: pnpm exec ultracite check --disable-nested-config

      # 純函式的單元測試(語言偵測、位元組格式化、PATCH 請求的組法)。
      # 不需要瀏覽器環境,所以跑得很快,放在最後當守門員。
      - run: pnpm turbo run test --filter=web

      # Two apps, two rows in one report — `bundle-size.sh` appends, it does
      # not overwrite. Runs after everything above so a build that fails
      # type-checking never gets a size reported for it.
      - name: Measure web
        run: .github/scripts/bundle-size.sh web apps/web/dist
      - name: Measure admin
        run: .github/scripts/bundle-size.sh admin apps/admin/dist
      - name: Assemble the bundle-size report
        id: bundle-size
        run: .github/scripts/bundle-size-finalize.sh

      # Only main, and only once every check above has passed — the same
      # reasoning as the server image's baseline, in `rust.yml`.
      - name: Record this build as the baseline
        if: github.ref == 'refs/heads/main'
        run: |
          cp /tmp/tessera-bundle-size/web/current.txt /tmp/tessera-bundle-size/web/main.txt
          cp /tmp/tessera-bundle-size/admin/current.txt /tmp/tessera-bundle-size/admin/main.txt

  # Split out for the same reason `image-size-comment` is split out of
  # `docker` in rust.yml: `check` runs no third-party action that could abuse
  # `pull-requests: write`, but keeping the scope on a job that does nothing
  # else means it stays that way even if one is added here later.
  bundle-size-comment:
    name: bundle size comment
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    needs: check
    if: >-
      always() && github.event_name == 'pull_request' && needs.check.outputs.report != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post the bundle-size table
        run: .github/scripts/pr-comment.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- tessera:bundle-size -->"
          BODY: ${{ needs.check.outputs.report }}
