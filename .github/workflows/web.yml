  # - uncomment the `web` output of `check` above, which decides whether this runs
  # - `runs-on: ubuntu-latest`
  # - install Chromium with `playwright install --with-deps chromium` (hosted
  #   runners have passwordless sudo) and drop the ldd check
  # - cargo: a hosted runner is a new machine each time, with no shared
  #   `../.cargo-target`. Drop CARGO_TARGET_DIR and `./.github/actions/rust`
  #   (written for the self-hosted box) and use Swatinem/rust-cache
  #   (rust-scheduled.yml already pins a version)
  # - the two steps that clean up a leftover backend do nothing on a fresh VM;
  #   keeping them is harmless
