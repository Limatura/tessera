  # Split out for the same reason `image-size-comment` is split out of
  # `docker` in rust.yml: `check` runs no third-party action that could abuse
  # `pull-requests: write`, but keeping the scope on a job that does nothing
  # else means it stays that way even if one is added here later.
  bundle-size-comment:
    name: bundle size comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    needs: check
    # Not for a fork's pull request: its token is read-only, so the post
    # would fail and turn a passing run red.
    if: >-
      always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.check.outputs.report != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post the bundle-size table
        run: .github/scripts/pr-comment.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: "<!-- tessera:bundle-size -->"
          BODY: ${{ needs.check.outputs.report }}
