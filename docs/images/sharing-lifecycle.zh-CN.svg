<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Tessera 分享生命周期</title><desc id="desc">上传内容、设置期限与取件次数、获取取件码并分享；收件者取件后，内容会在过期或达到次数上限时失效。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17100e"/><stop offset="1" stop-color="#0a0605"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#d94f2b"/></marker>
  <style>.eyebrow{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;fill:#d94f2b}.title{font:800 27px ui-sans-serif,system-ui,sans-serif;fill:#f5efe9}.desc{font:500 14px ui-sans-serif,system-ui,sans-serif;fill:#bfb2aa}.step{font:700 11px ui-monospace,monospace;letter-spacing:1.5px;fill:#d94f2b}.label{font:700 17px ui-sans-serif,system-ui,sans-serif;fill:#f5efe9}.small{font:500 12px ui-sans-serif,system-ui,sans-serif;fill:#bfb2aa}</style>
</defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/><circle cx="1090" cy="60" r="140" fill="#d94f2b" opacity=".06"/>
<text x="52" y="51" class="eyebrow">TESSERA / 分享流程</text><text x="52" y="91" class="title">让分享从一开始就有期限。</text><text x="52" y="119" class="desc">无需管理永久链接，只需要取件码、接收者与明确的使用限制。</text>
<g fill="none" stroke="#d94f2b" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M206 228 H237"/><path d="M392 228 H423"/><path d="M578 228 H609"/><path d="M764 228 H795"/><path d="M950 228 H981"/>
</g>
<g>
  <rect x="52" y="163" width="154" height="130" rx="15" fill="#211714" stroke="#513026" stroke-width="1.5"/><circle cx="82" cy="194" r="17" fill="#d94f2b"/><text x="82" y="200" text-anchor="middle" font-size="17" fill="#fff">↑</text><text x="72" y="237" class="step">01 / 上传</text><text x="72" y="261" class="label">上传内容</text><text x="72" y="281" class="small">文件或笔记</text>
  <rect x="238" y="163" width="154" height="130" rx="15" fill="#211714" stroke="#513026" stroke-width="1.5"/><circle cx="268" cy="194" r="17" fill="#f39c12"/><text x="268" y="200" text-anchor="middle" font-size="17" fill="#0a0605">◷</text><text x="258" y="237" class="step">02 / 设置限制</text><text x="258" y="261" class="label">设置规则</text><text x="258" y="281" class="small">有效期限与取件次数</text>
  <rect x="424" y="163" width="154" height="130" rx="15" fill="#211714" stroke="#513026" stroke-width="1.5"/><circle cx="454" cy="194" r="17" fill="#8e44ad"/><text x="454" y="200" text-anchor="middle" font-size="17" fill="#fff">#</text><text x="444" y="237" class="step">03 / 取件码</text><text x="444" y="261" class="label">获取取件码</text><text x="444" y="281" class="small">短取件码</text>
  <rect x="610" y="163" width="154" height="130" rx="15" fill="#211714" stroke="#513026" stroke-width="1.5"/><circle cx="640" cy="194" r="17" fill="#16a085"/><text x="640" y="200" text-anchor="middle" font-size="17" fill="#fff">↗</text><text x="630" y="237" class="step">04 / 分享</text><text x="630" y="261" class="label">分享取件码</text><text x="630" y="281" class="small">通过其他渠道发送</text>
  <rect x="796" y="163" width="154" height="130" rx="15" fill="#211714" stroke="#513026" stroke-width="1.5"/><circle cx="826" cy="194" r="17" fill="#3498db"/><text x="826" y="200" text-anchor="middle" font-size="17" fill="#fff">↓</text><text x="816" y="237" class="step">05 / 取件</text><text x="816" y="261" class="label">接收内容</text><text x="816" y="281" class="small">接收者获取内容</text>
  <rect x="982" y="163" width="166" height="130" rx="15" fill="#f5efe9"/><circle cx="1012" cy="194" r="17" fill="#d94f2b"/><text x="1012" y="200" text-anchor="middle" font-size="17" fill="#fff">✓</text><text x="1002" y="237" font-family="ui-monospace,monospace" font-size="11" font-weight="700" letter-spacing="1.5" fill="#d94f2b">06 / 过期</text><text x="1002" y="261" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="700" fill="#0a0605">自动清理</text><text x="1002" y="281" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#62534c">到期或次数用尽</text>
</g>
<path d="M1050 307 V340 H316 V307" fill="none" stroke="#d94f2b" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 6"/>
<text x="600" y="369" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2" fill="#d94f2b">短暂分享，设计如此</text>
<text x="600" y="397" text-anchor="middle" class="desc">内容按有效期限与取件次数限制管理，而不是永久网址。</text>
</svg>