packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
catalog:
  dotenv: ^17.4.2
  "@base-ui/react": ^1.7.0
  "@tabler/icons-react": ^3.20.0
  input-otp: ^1.4.2
  # web 原本就鎖死 3.8.0,沿用
  recharts: 3.8.0
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^22.20.1
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  "@libsql/client": 0.17.4
  libsql: 0.5.29
  "@orpc/server": ^1.14.12
  "@orpc/client": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/zod": ^1.14.12
  better-auth: 1.6.25
